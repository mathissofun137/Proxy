<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position:fixed;inset:0;background:#000;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;margin:0;padding:0;background:#000;">
      <head>
        <meta charset="UTF-8"/>
        <title>Mac OS</title>
        <style>
          /* <![CDATA[ */
          html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
          iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; background:#000; }
          #status { color:#fff; font-family:system-ui,sans-serif; padding:20px; }
          /* ]]> */
        </style>
      </head>
      <body>
        <p id="status">Loading Mac OS…</p>
        <script>
        //<![CDATA[
          /* This SVG does three things, in order:
             1. creates Scramjet's IndexedDB tables (its worker would otherwise leave them empty)
             2. registers sw.js, which must sit in the same folder as this file, on the same host
             3. opens ./app.html in a frame. app.html is not a real file: sw.js builds it from the CDN copy
                of your HTML, so the page has a normal https address and can use the service worker. */
          (async function () {
            var XHTML = "http://www.w3.org/1999/xhtml";
            var body = document.body || document.getElementsByTagName("body")[0] || document.documentElement;
            var status = document.getElementById("status");
            function say(t) { if (status) status.textContent = t; }

            try {
              if (!("serviceWorker" in navigator)) throw new Error("Service workers need HTTPS");
              var dir = new URL("./", location.href);
              var SW_URL = new URL("sw.js", dir).href;
              var APP_URL = new URL("app.html", dir).href;

              say("Preparing storage…");
              var need = ["config", "cookies", "redirectTrackers", "referrerPolicies", "publicSuffixList"];
              function openDB() {
                return new Promise(function (ok, no) {
                  var r = indexedDB.open("$scramjet", 1);
                  r.onupgradeneeded = function () {
                    need.forEach(function (n) { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); });
                  };
                  r.onsuccess = function () { ok(r.result); };
                  r.onerror = function () { no(r.error); };
                });
              }
              var db = await openDB();
              var healthy = need.every(function (n) { return db.objectStoreNames.contains(n); });
              db.close();
              if (!healthy) {
                var regs = await navigator.serviceWorker.getRegistrations();
                for (var i = 0; i < regs.length; i++) await regs[i].unregister();
                var deleted = await new Promise(function (res) {
                  var d = indexedDB.deleteDatabase("$scramjet");
                  d.onsuccess = function () { res(true); };
                  d.onerror = function () { res(false); };
                  d.onblocked = function () { res(false); };
                });
                if (!deleted) throw new Error("Old storage is locked. Close other tabs of this site and reload.");
                (await openDB()).close();
              }

              say("Starting service worker…");
              await navigator.serviceWorker.register(SW_URL, { scope: dir.pathname });
              await navigator.serviceWorker.ready;

              say("Loading…");
              var iframe = document.createElementNS(XHTML, "iframe");
              iframe.setAttribute("style", "position:absolute;top:0;left:0;width:100%;height:100%;border:none;background:#000;");
              iframe.setAttribute("allow", "fullscreen; autoplay; gamepad; clipboard-write");
              iframe.setAttribute("allowfullscreen", "true");
              iframe.setAttribute("src", APP_URL);
              body.appendChild(iframe);
              if (status) status.setAttribute("style", "display:none");
            } catch (err) {
              say("Failed to load: " + ((err && err.message) ? err.message : String(err)));
            }
          })();
        //]]>
        </script>
      </body>
    </html>
  </foreignObject>
</svg>
