<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Proxy</title>
    <style>
      :root {
        --bg-1: #dde3ea;
        --bg-2: #edf2f7;
        --chrome: #ebedf1;
        --chrome-strong: #dfe3ea;
        --panel: rgba(255, 255, 255, 0.75);
        --field: rgba(255,255,255,0.58);
        --text: #1f2227;
        --muted: #58616d;
        --line: rgba(35,40,48,0.09);
        --shadow: rgba(21, 29, 38, 0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 26px;
      }

      .browser {
        width: min(1200px, 94vw);
        min-height: 785px;
        background: rgba(255,255,255,0.4);
        border: 1px solid rgba(105, 117, 130, 0.22);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 30px 70px var(--shadow);
        backdrop-filter: blur(10px);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 64px;
        padding: 0 18px;
        background: linear-gradient(180deg, var(--chrome), var(--chrome-strong));
        border-bottom: 1px solid var(--line);
      }

      .traffic {
        display: flex;
        gap: 8px;
        width: 100px;
        flex-shrink: 0;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      .dot.red { background: #ef6558; }
      .dot.yellow { background: #f0c74e; }
      .dot.green { background: #62c555; }

      .form-shell {
        flex: 1;
        display: flex;
        justify-content: center;
      }

      .address-form {
        width: min(740px, 100%);
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--field);
        border: 1px solid rgba(126,133,143,0.18);
        border-radius: 18px;
        padding: 0 12px 0 14px;
        height: 38px;
      }

      .padlock {
        font-size: 13px;
        color: var(--muted);
      }

      .address-input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 13px;
        color: var(--text);
        font-family: inherit;
      }

      .go-btn {
        border: none;
        background: #e8ecf3;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        height: 28px;
        padding: 0 12px;
        cursor: pointer;
      }

      .page {
        background: rgba(255,255,255,0.18);
        padding: 16px;
      }

      .proxy-view {
        width: 100%;
        height: calc(785px - 64px - 32px);
        border: 1px solid rgba(120,126,134,0.12);
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: white;
      }

      .fallback {
        display: none;
        width: 100%;
        height: 100%;
        padding: 22px;
        background: #f7f8fa;
        overflow: auto;
      }

      .fallback.active { display: block; }

      .fallback pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        color: #2d3440;
      }

      @media (max-width: 700px) {
        body { padding: 12px; }
        .browser { width: 100%; min-height: 660px; }
        .toolbar { gap: 10px; padding: 0 12px; }
        .traffic { width: 72px; }
        .address-form { gap: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="browser" aria-label="Web proxy browser window">
      <div class="toolbar">
        <div class="traffic" aria-hidden="true">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>

        <div class="form-shell">
          <form class="address-form" id="proxyForm">
            <span class="padlock">🔒</span>
            <input id="urlInput" class="address-input" type="text" value="example.com" aria-label="Website URL" />
            <button class="go-btn" type="submit">Go</button>
          </form>
        </div>
      </div>

      <div class="page">
        <div class="proxy-view">
          <iframe id="proxyFrame" title="Proxy page" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
          <div id="fallback" class="fallback" aria-live="polite">
            <pre id="fallbackContent"></pre>
          </div>
        </div>
      </div>
    </div>

    <script>
      const frame = document.getElementById('proxyFrame');
      const fallback = document.getElementById('fallback');
      const fallbackContent = document.getElementById('fallbackContent');
      const input = document.getElementById('urlInput');

      function normalizeUrl(raw) {
        const value = raw.trim();
        if (!value) return 'https://example.com';
        if (/^https?:\/\//i.test(value)) return value;
        if (/^\//.test(value)) return 'https:' + value;
        return 'https://' + value;
      }

      function proxyUrlFor(target) {
        const cleaned = target.replace(/^https?:\/\//i, '');
        return 'https://r.jina.ai/http://' + cleaned;
      }

      function loadTarget(rawUrl) {
        const target = normalizeUrl(rawUrl);
        const proxied = proxyUrlFor(target);
        input.value = target;

        frame.style.display = 'block';
        fallback.classList.remove('active');
        frame.src = proxied;

        fetch(proxied)
          .then(async response => {
            if (!response.ok) throw new Error('Proxy response failed');
            const text = await response.text();
            if (!text || text.length < 50) {
              throw new Error('Empty response');
            }
            fallbackContent.textContent = text.slice(0, 12000);
          })
          .catch(() => {
            fallbackContent.textContent = 'The remote page could not be fetched through the proxy. This is commonly caused by browser security policies or the target site blocking embedded access.';
          });
      }

      document.getElementById('proxyForm').addEventListener('submit', function (event) {
        event.preventDefault();
        loadTarget(input.value);
      });

      loadTarget('example.com');
    </script>
  </body>
</html>
